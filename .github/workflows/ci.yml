name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install tooling
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy
          # Home Assistant still pins lru-dict 1.3.0, which has no wheel for
          # Python 3.13; 1.4.1 is API compatible and ships one.
          printf 'lru-dict==1.4.1\n' > /tmp/overrides.txt
          pip install -c /tmp/overrides.txt pytest-homeassistant-custom-component
      - name: Ruff
        run: ruff check custom_components tests
      - name: Ruff format
        run: ruff format --check custom_components tests
      - name: Mypy
        run: mypy

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          printf 'lru-dict==1.4.1\n' > /tmp/overrides.txt
          pip install -c /tmp/overrides.txt pytest-homeassistant-custom-component
      - name: Run the test suite
        run: python -m pytest -q

  hassfest:
    name: hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
