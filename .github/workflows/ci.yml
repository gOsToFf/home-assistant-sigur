name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Load bearing: Home Assistant 2026.8 requires 3.14.2 and the test harness
  # requires 3.14. On an older interpreter the resolver quietly settles on the
  # newest combination that fits, and the suite then tests a Home Assistant
  # months behind what users run - without failing, which is the dangerous part.
  PYTHON_VERSION: "3.14"

jobs:
  lint:
    name: Lint and type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: ./.github/actions/install-test-deps
      - name: Install linters
        run: uv pip install --system ruff mypy
      - name: Ruff
        run: ruff check custom_components tests scripts
      - name: Ruff format
        run: ruff format --check custom_components tests scripts
      - name: Mypy
        run: mypy

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: ./.github/actions/install-test-deps
      - name: Run the test suite
        run: python -m pytest -q

  hassfest:
    name: hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
