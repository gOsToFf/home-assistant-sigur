name: Install test dependencies
description: >-
  Install the Home Assistant custom-component test harness.

  Home Assistant pins lru-dict 1.3.0, which has no wheel for Python 3.13 and
  needs a C toolchain to build. 1.4.1 is API compatible and ships wheels, but
  relaxing a hard pin needs a real override: pip's -c only constrains, it
  cannot loosen, so uv is used here and in scripts/Dockerfile.tests alike.

runs:
  using: composite
  steps:
    - name: Install uv
      shell: bash
      run: python -m pip install --quiet --upgrade pip uv

    - name: Install the test harness
      shell: bash
      run: |
        printf 'lru-dict==1.4.1\n' > "${RUNNER_TEMP}/overrides.txt"
        uv pip install --system \
          --overrides "${RUNNER_TEMP}/overrides.txt" \
          pytest-homeassistant-custom-component

    - name: Install the frontend package
      shell: bash
      # Not a dependency of the homeassistant wheel, but the integration
      # registers a sidebar panel, so `frontend` and `panel_custom` must be
      # able to set up. Take the version Home Assistant itself asks for.
      run: |
        python - <<'PY' > "${RUNNER_TEMP}/frontend.txt"
        import json
        import pathlib

        import homeassistant.components.frontend as frontend

        manifest = pathlib.Path(frontend.__file__).parent / "manifest.json"
        print(json.loads(manifest.read_text())["requirements"][0])
        PY
        uv pip install --system -r "${RUNNER_TEMP}/frontend.txt"
